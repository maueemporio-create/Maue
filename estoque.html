<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedidos Salão — Mauê Empório</title>
<style>
  :root {
    --surface-0: #FAF9F6;
    --surface-1: #F1EFE8;
    --surface-2: #FFFFFF;
    --text-primary: #2C2C2A;
    --text-secondary: #5F5E5A;
    --text-muted: #888780;
    --text-danger: #A32D2D;
    --text-success: #3B6D11;
    --border: #D3D1C7;
    --border-accent: #185FA5;
    --text-accent: #185FA5;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--surface-0);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 2rem 1rem;
  }
  input, button {
    font-family: inherit;
    font-size: 14px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border);
  }
  input { padding: 6px 8px; }
  button {
    background: var(--surface-2);
    padding: 8px 14px;
    cursor: pointer;
  }
  button:hover { background: var(--surface-1); }
  button:active { transform: scale(0.98); }
  .tab-btn.active {
    background: var(--text-primary);
    color: var(--surface-2);
    border-color: var(--text-primary);
  }
</style>
</head>
<body>

<div style="max-width: 680px; margin: 0 auto;">
  <a href="index.html" style="font-size:13px; color:var(--text-secondary); text-decoration:none; display:inline-block; margin-bottom:1rem;">&larr; Voltar</a>
  <h1 style="font-size: 22px; font-weight: 500; margin-bottom: 4px;">Pedidos Salão — Mauê Empório</h1>
  <p id="status-line" style="font-size:13px; color:var(--text-secondary); margin-top:0; margin-bottom: 1rem;">Conectando à planilha...</p>

  <div id="config-box" style="background:var(--surface-1); border-radius:var(--radius); padding:0.75rem 1rem; margin-bottom:1.25rem;">
    <label style="font-size:12px; color:var(--text-secondary); display:block; margin-bottom:4px;">URL do aplicativo da web (Google Apps Script)</label>
    <div style="display:flex; gap:8px;">
      <input id="script-url" type="text" placeholder="https://script.google.com/macros/s/.../exec" style="flex:1;">
      <button id="save-url-btn" style="white-space:nowrap;">Conectar</button>
    </div>
  </div>

  <div id="tabs" style="display:flex; gap:8px; margin-bottom:1.25rem; flex-wrap:wrap;"></div>

  <div id="summary" style="display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap:12px; margin-bottom:1.5rem;"></div>

  <div style="display:flex; justify-content:flex-end; margin-bottom:8px;">
    <button id="novo-produto-btn" style="font-size:13px;">+ Novo produto</button>
  </div>
  <div id="novo-produto-form" style="display:none; flex-direction:column; gap:8px; background:var(--surface-1); border-radius:var(--radius); padding:1rem; margin-bottom:1rem;">
    <input id="np-nome" type="text" placeholder="Nome do produto">
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <input id="np-unidade" type="text" placeholder="Unidade (ex: garrafas)" style="flex:1; min-width:120px;">
      <input id="np-fornecedor" type="text" placeholder="Fornecedor (opcional)" style="flex:1; min-width:120px;">
      <input id="np-min" type="number" min="0" placeholder="Minimo" style="width:80px;">
      <input id="np-ideal" type="number" min="0" placeholder="Ideal" style="width:80px;">
    </div>
    <div style="display:flex; gap:8px; justify-content:flex-end;">
      <button id="np-cancelar">Cancelar</button>
      <button id="np-salvar" style="border-color:var(--border-accent); color:var(--text-accent);">Adicionar produto</button>
    </div>
  </div>

  <div id="list" style="display:flex; flex-direction:column; gap:8px;"></div>

  <div style="display:flex; gap:8px; margin-top:1.25rem;">
    <button id="save-btn" style="flex:1;">Salvar alteracoes</button>
  </div>

  <div style="margin-top:1.5rem; padding-top:1.25rem; border-top:0.5px solid var(--border);">
    <div style="font-size:14px; font-weight:500; margin-bottom:8px;">Mensagem para pedido</div>
    <div id="msg-container" style="display:flex; flex-direction:column; gap:12px;"></div>
  </div>

  <div style="margin-top:1rem; padding-top:1rem; border-top:0.5px solid var(--border); font-size:12px; color:var(--text-muted);">
    Os dados de estoque vivem na planilha do Google Sheets do Mauê Empório.
  </div>
</div>

<script>
const URL_KEY = "maue-emporio-script-url";
const DEFAULT_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyIWxnYDtKZJxQGQsv37fN1m_B0frTzgKZ2tZHVjOb8NtH66XgarDNChzhvM2EeaIP83Q/exec";
const ABAS = [
  { id: "Vinhos", label: "Vinhos" },
  { id: "Cervejas", label: "Cervejas" },
  { id: "Nao Alcoolicos", label: "Nao alcoolicos" },
  { id: "Destilados", label: "Destilados" },
  { id: "Insumos Drinks", label: "Insumos Drinks" },
  { id: "Contagem Cozinha", label: "Contagem Cozinha" }
];
let currentAba = ABAS[0].id;
let items = [];
let scriptUrl = "";

function init() {
  scriptUrl = localStorage.getItem(URL_KEY) || DEFAULT_SCRIPT_URL;
  document.getElementById("script-url").value = scriptUrl;
  renderTabs();
  if (scriptUrl) {
    loadFromSheet();
  } else {
    setStatus("Configure a URL da planilha abaixo");
  }
}

function renderTabs() {
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = ABAS.map(a =>
    '<button class="tab-btn ' + (a.id === currentAba ? 'active' : '') + '" data-aba="' + a.id + '">' + a.label + '</button>'
  ).join("");
  tabs.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      currentAba = btn.dataset.aba;
      renderTabs();
      if (scriptUrl) loadFromSheet();
    });
  });
}

async function saveUrl() {
  scriptUrl = document.getElementById("script-url").value.trim();
  localStorage.setItem(URL_KEY, scriptUrl);
  if (scriptUrl) await loadFromSheet();
}

function jsonp(url) {
  return new Promise((resolve, reject) => {
    const callbackName = "jsonp_cb_" + Math.random().toString(36).slice(2);
    const script = document.createElement("script");
    window[callbackName] = (data) => { resolve(data); cleanup(); };
    function cleanup() {
      delete window[callbackName];
      if (script.parentNode) script.parentNode.removeChild(script);
      clearTimeout(timer);
    }
    const timer = setTimeout(() => { reject(new Error("timeout")); cleanup(); }, 15000);
    script.onerror = () => { reject(new Error("jsonp failed")); cleanup(); };
    script.src = url + (url.includes("?") ? "&" : "?") + "callback=" + callbackName;
    document.body.appendChild(script);
  });
}

async function loadFromSheet() {
  setStatus("Carregando " + currentAba + "...");
  try {
    const url = scriptUrl + "?aba=" + encodeURIComponent(currentAba);
    const data = await jsonp(url);
    items = data.map((it, i) => ({
      id: "item-" + i,
      nome: it.produto,
      grupo: it.grupo || currentAba,
      unidade: it.unidade || "unidades",
      fornecedor: it.fornecedor || "",
      min: Number(it.min) || 0,
      atual: Number(it.atual) || 0,
      ideal: Number(it.ideal) || 0,
      retornavel: !!it.retornavel,
      caixasVazias: Number(it.caixasVazias) || 0,
      pool: it.pool || null,
      ultimaAtualizacao: it.ultimaAtualizacao || ""
    }));
    setStatus("Conectado — " + currentAba + " carregado da planilha");
    render();
  } catch (e) {
    setStatus("Nao foi possivel carregar a planilha. Confira a URL.");
    console.error(e);
  }
}

async function pushToSheet(list) {
  const payload = list.map(it => ({ produto: it.nome, min: it.min, atual: it.atual, ideal: it.ideal, caixasVazias: it.caixasVazias }));
  const url = scriptUrl + "?action=write&aba=" + encodeURIComponent(currentAba) + "&payload=" + encodeURIComponent(JSON.stringify(payload));
  return jsonp(url);
}

function setStatus(msg) {
  document.getElementById("status-line").textContent = msg;
}

// Modelo minimo/ideal: o Minimo so dispara o alerta ("abaixo disso,
// precisa pedir"); a quantidade sugerida repõe ate o Ideal. Em itens
// retornaveis (cerveja de garrafa 600ml, agua/agua com gas), o pedido
// tambem nao pode passar do numero de caixas vazias disponiveis pra
// trocar com o fornecedor.
function precisaPedir(item) {
  return item.atual < item.min;
}

function pedirBase(item) {
  return precisaPedir(item) ? Math.max(0, item.ideal - item.atual) : 0;
}

function pedirFinal(item) {
  const base = pedirBase(item);
  if (item.retornavel) return Math.min(base, item.caixasVazias);
  return base;
}

function limitadoPorVazias(item) {
  return item.retornavel && pedirBase(item) > pedirFinal(item);
}

function render() {
  const list = document.getElementById("list");
  const summary = document.getElementById("summary");

  const totalPedir = items.reduce((acc, it) => acc + pedirFinal(it), 0);
  const itensAbaixo = items.filter(it => precisaPedir(it)).length;
  const itensOk = items.length - itensAbaixo;

  summary.innerHTML =
    '<div style="background:var(--surface-1); border-radius:var(--radius); padding:1rem;">' +
      '<div style="font-size:13px; color:var(--text-secondary);">Itens a pedir</div>' +
      '<div style="font-size:24px; font-weight:500; color:var(--text-danger);">' + totalPedir + '</div>' +
    '</div>' +
    '<div style="background:var(--surface-1); border-radius:var(--radius); padding:1rem;">' +
      '<div style="font-size:13px; color:var(--text-secondary);">Abaixo do minimo</div>' +
      '<div style="font-size:24px; font-weight:500;">' + itensAbaixo + '</div>' +
    '</div>' +
    '<div style="background:var(--surface-1); border-radius:var(--radius); padding:1rem;">' +
      '<div style="font-size:13px; color:var(--text-secondary);">Ok</div>' +
      '<div style="font-size:24px; font-weight:500;">' + itensOk + '</div>' +
    '</div>';

  const groups = [...new Set(items.map(i => i.grupo))];
  list.innerHTML = groups.map(g =>
    '<div style="font-size:13px; font-weight:500; color:var(--text-secondary); margin:8px 0 2px;">' + g + '</div>' +
    items.filter(i => i.grupo === g).map(it => rowHtml(it)).join("")
  ).join("");

  items.forEach(it => {
    const atualInput = document.getElementById("atual-" + it.id);
    if (atualInput) atualInput.addEventListener("input", e => onChange(it.id, "atual", e.target.value));
    const minInput = document.getElementById("min-" + it.id);
    if (minInput) minInput.addEventListener("input", e => onChange(it.id, "min", e.target.value));
    const idealInput = document.getElementById("ideal-" + it.id);
    if (idealInput) idealInput.addEventListener("input", e => onChange(it.id, "ideal", e.target.value));
    const vaziasInput = document.getElementById("vazias-" + it.id);
    if (vaziasInput) vaziasInput.addEventListener("input", e => onChange(it.id, "caixasVazias", e.target.value));
  });

  list.querySelectorAll(".remove-item-btn").forEach(btn => {
    btn.addEventListener("click", () => removerProduto(btn.dataset.id));
  });

  renderMessages();
}

function rowHtml(it) {
  const pedir = pedirFinal(it);
  const ok = !precisaPedir(it);
  const capado = limitadoPorVazias(it);
  return '<div style="background:var(--surface-2); border:0.5px solid var(--border); border-radius:12px; padding:0.75rem 1rem;">' +
    '<div style="display:flex; align-items:flex-start; gap:8px;">' +
      '<div style="flex:1; min-width:0;">' +
        '<div style="font-size:14px; font-weight:500; color:var(--text-primary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">' + it.nome + '</div>' +
        '<div style="font-size:12px; color:' + (ok ? 'var(--text-success)' : 'var(--text-danger)') + '; margin-top:2px;">' +
          (ok ? 'Estoque ok' : ('Pedir ' + pedir + ' ' + it.unidade)) +
        '</div>' +
        (capado ? '<div style="font-size:11px; color:var(--text-danger); margin-top:2px;">Precisaria de ' + pedirBase(it) + ', mas so tem ' + it.caixasVazias + ' caixa(s) vazia(s)</div>' : '') +
        (it.fornecedor ? '<div style="font-size:11px; color:var(--text-muted); margin-top:2px;">Fornecedor: ' + it.fornecedor + '</div>' : '') +
        (it.pool ? '<div style="font-size:11px; color:var(--text-muted); margin-top:2px;">Vasilhame compartilhado: ' + it.pool + '</div>' : '') +
        (it.ultimaAtualizacao ? '<div style="font-size:11px; color:var(--text-muted); margin-top:2px;">Atualizado em ' + it.ultimaAtualizacao + '</div>' : '') +
      '</div>' +
      '<button class="remove-item-btn" data-id="' + it.id + '" title="Remover produto" style="border:none; background:transparent; color:var(--text-muted); font-size:18px; line-height:1; padding:0 2px;">&times;</button>' +
    '</div>' +
    '<div style="display:flex; flex-wrap:wrap; gap:12px; margin-top:8px;">' +
      '<div style="display:flex; align-items:center; gap:4px;">' +
        '<label style="font-size:11px; color:var(--text-muted);">Min</label>' +
        '<input type="number" min="0" id="min-' + it.id + '" value="' + it.min + '" style="width:48px; text-align:center;" onfocus="this.select()">' +
      '</div>' +
      '<div style="display:flex; align-items:center; gap:4px;">' +
        '<label style="font-size:11px; color:var(--text-muted);">Ideal</label>' +
        '<input type="number" min="0" id="ideal-' + it.id + '" value="' + it.ideal + '" style="width:48px; text-align:center;" onfocus="this.select()">' +
      '</div>' +
      '<div style="display:flex; align-items:center; gap:4px;">' +
        '<label style="font-size:11px; color:var(--text-muted);">Atual</label>' +
        '<input type="number" min="0" id="atual-' + it.id + '" value="' + it.atual + '" style="width:52px; text-align:center;" onfocus="this.select()">' +
      '</div>' +
      (it.retornavel && it.pool ?
        '<div style="display:flex; align-items:center; gap:4px;">' +
          '<label style="font-size:11px; color:var(--text-muted);">Caixas vazias (' + it.pool + ')</label>' +
          '<span style="width:48px; text-align:center; font-size:13px;">' + it.caixasVazias + '</span>' +
        '</div>'
      : it.retornavel ?
        '<div style="display:flex; align-items:center; gap:4px;">' +
          '<label style="font-size:11px; color:var(--text-muted);">Caixas vazias</label>' +
          '<input type="number" min="0" id="vazias-' + it.id + '" value="' + it.caixasVazias + '" style="width:48px; text-align:center;" onfocus="this.select()">' +
        '</div>'
      : '') +
    '</div>' +
  '</div>';
}

async function removerProduto(id) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  if (!confirm('Remover "' + item.nome + '" da lista de ' + currentAba + '? Isso apaga a linha na planilha.')) return;
  setStatus("Removendo produto...");
  try {
    const url = scriptUrl + "?action=delete_produto&aba=" + encodeURIComponent(currentAba) + "&produto=" + encodeURIComponent(item.nome);
    const res = await jsonp(url);
    if (res && res.erro) { setStatus(res.erro); return; }
    setStatus("Produto removido.");
    await loadFromSheet();
  } catch (e) {
    setStatus("Erro ao remover produto. Tente novamente.");
    console.error(e);
  }
}

function toggleNovoProdutoForm(show) {
  const form = document.getElementById("novo-produto-form");
  form.style.display = show ? "flex" : "none";
}

async function adicionarProduto() {
  const nome = document.getElementById("np-nome").value.trim();
  if (!nome) { alert("Digite o nome do produto."); return; }
  const payload = {
    produto: nome,
    grupo: currentAba,
    unidade: document.getElementById("np-unidade").value.trim() || "unidades",
    fornecedor: document.getElementById("np-fornecedor").value.trim(),
    min: Number(document.getElementById("np-min").value) || 0,
    ideal: Number(document.getElementById("np-ideal").value) || 0,
    atual: 0
  };
  setStatus("Adicionando produto...");
  try {
    const url = scriptUrl + "?action=add_produto&aba=" + encodeURIComponent(currentAba) + "&payload=" + encodeURIComponent(JSON.stringify(payload));
    const res = await jsonp(url);
    if (res && res.erro) { setStatus(res.erro); return; }
    document.getElementById("np-nome").value = "";
    document.getElementById("np-unidade").value = "";
    document.getElementById("np-fornecedor").value = "";
    document.getElementById("np-min").value = "";
    document.getElementById("np-ideal").value = "";
    toggleNovoProdutoForm(false);
    setStatus("Produto adicionado!");
    await loadFromSheet();
  } catch (e) {
    setStatus("Erro ao adicionar produto. Tente novamente.");
    console.error(e);
  }
}

function onChange(id, field, value) {
  const num = Math.max(0, parseInt(value, 10) || 0);
  const item = items.find(i => i.id === id);
  item[field] = num;
  render();
}

function formatMsg(pedir) {
  let msg = "Bom dia, segue o pedido para a semana:\n\n";
  if (pedir.length === 0) {
    msg += "Estoque em dia, sem pedido no momento.";
  } else {
    msg += pedir.map(it => "- " + it.nome + " — " + pedirFinal(it) + " " + it.unidade).join("\n");
    msg += "\n\nObrigado!";
  }
  return msg;
}

// Agrupa os itens que precisam de pedido pelo valor da coluna
// "Fornecedor" na planilha. Itens sem fornecedor definido (celula
// vazia) ficam de fora de qualquer mensagem - pedido feito por
// aplicativo ou outro meio, sem geracao automatica de texto.
function buildMessageBlocks() {
  const pedir = items.filter(it => pedirFinal(it) > 0 && it.fornecedor && it.fornecedor.trim() !== "");

  if (pedir.length === 0) {
    return [{ label: null, text: "Nenhum fornecedor configurado para pedido automatico nesta aba no momento (ou estoque em dia).", items: [] }];
  }

  const fornecedores = [...new Set(pedir.map(it => it.fornecedor))];
  return fornecedores.map(f => ({
    label: f,
    text: formatMsg(pedir.filter(it => it.fornecedor === f)),
    items: pedir.filter(it => it.fornecedor === f)
  }));
}

function renderMessages() {
  const container = document.getElementById("msg-container");
  const blocks = buildMessageBlocks();
  container.innerHTML = blocks.map((b, i) =>
    '<div>' +
      (b.label ? '<div style="font-size:12px; color:var(--text-secondary); margin-bottom:4px;">' + b.label + '</div>' : '') +
      '<div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">' +
        '<pre style="white-space:pre-wrap; font-family:inherit; font-size:13px; color:var(--text-primary); background:var(--surface-1); border-radius:var(--radius); padding:0.75rem 1rem; margin:0; flex:1;">' + b.text + '</pre>' +
        '<div style="display:flex; flex-direction:column; gap:4px;">' +
          '<button class="copy-msg-btn" data-idx="' + i + '" style="white-space:nowrap;">Copiar</button>' +
          (b.items.length > 0 ? '<button class="pedido-msg-btn" data-idx="' + i + '" style="white-space:nowrap; border-color:var(--border-accent); color:var(--text-accent);">Fazer pedido</button>' : '') +
        '</div>' +
      '</div>' +
    '</div>'
  ).join("");

  container.querySelectorAll(".copy-msg-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const idx = Number(btn.dataset.idx);
      try {
        await navigator.clipboard.writeText(blocks[idx].text);
        btn.textContent = "Copiado";
        setTimeout(() => { btn.textContent = "Copiar"; }, 1500);
      } catch (e) {
        console.error("Erro ao copiar", e);
      }
    });
  });

  container.querySelectorAll(".pedido-msg-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const idx = Number(btn.dataset.idx);
      const idsDoBloco = new Set(blocks[idx].items.map(it => it.id));
      items = items.map(it => {
        if (!idsDoBloco.has(it.id)) return it;
        const qtd = pedirFinal(it);
        return {
          ...it,
          atual: it.atual + qtd,
          caixasVazias: it.retornavel ? Math.max(0, it.caixasVazias - qtd) : it.caixasVazias
        };
      });
      render();
      setStatus("Registrando pedido na planilha...");
      try {
        await pushToSheet(items);
        setStatus("Pedido registrado — estoque atualizado na planilha");
        await loadFromSheet();
      } catch (e) {
        setStatus("Erro ao registrar pedido. Tente novamente.");
        console.error(e);
      }
    });
  });
}

document.getElementById("save-url-btn").addEventListener("click", saveUrl);

document.getElementById("novo-produto-btn").addEventListener("click", () => {
  const form = document.getElementById("novo-produto-form");
  toggleNovoProdutoForm(form.style.display === "none" || form.style.display === "");
});
document.getElementById("np-cancelar").addEventListener("click", () => toggleNovoProdutoForm(false));
document.getElementById("np-salvar").addEventListener("click", adicionarProduto);

document.getElementById("save-btn").addEventListener("click", async () => {
  if (!scriptUrl) { setStatus("Configure a URL da planilha primeiro."); return; }
  setStatus("Salvando na planilha...");
  try {
    await pushToSheet(items);
    setStatus("Alteracoes salvas na planilha");
    await loadFromSheet();
  } catch (e) {
    setStatus("Erro ao salvar. Confira a URL e tente novamente.");
    console.error(e);
  }
});

init();
</script>
</body>
</html>
